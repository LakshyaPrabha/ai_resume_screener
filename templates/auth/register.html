{% extends 'base.html' %}
{% block title %}Register — ResumeAI{% endblock %}
{% block content %}
<div style="max-width:420px;margin:4rem auto;">
  <div style="text-align:center;margin-bottom:2rem;">
    <div style="font-size:3rem;">🤖</div>
    <h1 style="font-size:1.8rem;font-weight:800;color:var(--white);margin-top:0.5rem;">ResumeAI</h1>
    <p style="color:var(--muted);">Create your account</p>
  </div>
  <div class="card">
    <h2 style="font-size:1.2rem;font-weight:700;color:var(--white);margin-bottom:1.5rem;">Create Account</h2>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Choose a username" required autofocus />
      </div>
      <div class="form-group">
        <label>Email <span style="color:var(--muted)">(optional)</span></label>
        <input type="email" name="email" placeholder="your@email.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password1" placeholder="Create a password" required />
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="password2" placeholder="Confirm your password" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:0.5rem;">Create Account</button>
    </form>
    <p style="text-align:center;margin-top:1.2rem;color:var(--muted);font-size:0.9rem;">
      Already have an account? <a href="{% url 'login' %}" style="color:var(--primary);">Login</a>
    </p>
  </div>
</div>
{% endblock %}
