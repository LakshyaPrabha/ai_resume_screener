{% extends 'base.html' %}
{% block title %}Login — ResumeAI{% endblock %}
{% block content %}
<div style="max-width:420px;margin:4rem auto;">
  <div style="text-align:center;margin-bottom:2rem;">
    <div style="font-size:3rem;">🤖</div>
    <h1 style="font-size:1.8rem;font-weight:800;color:var(--white);margin-top:0.5rem;">ResumeAI</h1>
    <p style="color:var(--muted);margin-top:0.3rem;">ATS Resume Screener powered by AI</p>
  </div>
  <div class="card">
    <h2 style="font-size:1.2rem;font-weight:700;color:var(--white);margin-bottom:1.5rem;">Welcome back</h2>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter your username" required autofocus />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:0.5rem;">Login</button>
    </form>
    <p style="text-align:center;margin-top:1.2rem;color:var(--muted);font-size:0.9rem;">
      Don't have an account? <a href="{% url 'register' %}" style="color:var(--primary);">Register</a>
    </p>
  </div>
</div>
{% endblock %}
