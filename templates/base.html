<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}AI Resume Screener{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #6c63ff;
      --primary-dark: #5a52d5;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --info: #3b82f6;
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --card2: #16213e;
      --border: #2a2a4a;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --white: #ffffff;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* NAVBAR */
    nav {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-brand {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .nav-links { display: flex; gap: 0.5rem; align-items: center; }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .nav-links a:hover { color: var(--text); background: var(--border); }
    .nav-links a.active { color: var(--primary); background: rgba(108,99,255,0.1); }
    .btn-nav {
      background: var(--primary);
      color: var(--white) !important;
      padding: 0.4rem 1rem !important;
      border-radius: 8px;
    }
    .btn-nav:hover { background: var(--primary-dark) !important; }

    /* MAIN */
    main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* CARDS */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--white);
    }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 1.4rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--primary); color: var(--white); }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn-outline {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-outline:hover { color: var(--text); border-color: var(--primary); }
    .btn-danger { background: var(--danger); color: var(--white); }
    .btn-danger:hover { background: #dc2626; }
    .btn-sm { padding: 0.35rem 0.8rem; font-size: 0.82rem; }

    /* FORMS */
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; font-size: 0.88rem; font-weight: 500; color: var(--muted); margin-bottom: 0.4rem; }
    input[type="text"], input[type="email"], input[type="password"],
    textarea, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem 0.9rem;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--primary); }
    textarea { resize: vertical; }

    /* ALERTS */
    .alert {
      padding: 0.8rem 1rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .alert-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
    .alert-success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }

    /* BADGES */
    .badge {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 500;
    }
    .badge-success { background: rgba(34,197,94,0.15); color: #4ade80; }
    .badge-danger { background: rgba(239,68,68,0.15); color: #f87171; }
    .badge-warning { background: rgba(245,158,11,0.15); color: #fbbf24; }
    .badge-info { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .badge-primary { background: rgba(108,99,255,0.15); color: #a78bfa; }

    /* GRID */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
    @media (max-width: 768px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      nav { padding: 0 1rem; }
      main { padding: 1rem; }
    }

    /* PAGE HEADER */
    .page-header { margin-bottom: 1.8rem; }
    .page-header h1 { font-size: 1.6rem; font-weight: 700; color: var(--white); }
    .page-header p { color: var(--muted); margin-top: 0.3rem; font-size: 0.95rem; }

    /* TABLE */
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 0.7rem 1rem; font-size: 0.82rem; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--border); }
    td { padding: 0.8rem 1rem; font-size: 0.9rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    /* SCORE RING */
    .score-ring { position: relative; width: 140px; height: 140px; margin: 0 auto; }
    .score-ring svg { transform: rotate(-90deg); }
    .score-text {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .score-text .num { font-size: 2rem; font-weight: 800; color: var(--white); }
    .score-text .label { font-size: 0.75rem; color: var(--muted); }

    /* SKILL TAGS */
    .tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
    .tag {
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 500;
    }
    .tag-green { background: rgba(34,197,94,0.12); color: #4ade80; border: 1px solid rgba(34,197,94,0.2); }
    .tag-red { background: rgba(239,68,68,0.12); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }

    /* SUGGESTIONS */
    .suggestion-item {
      display: flex;
      gap: 0.75rem;
      padding: 0.75rem;
      border-radius: 10px;
      background: var(--bg);
      margin-bottom: 0.6rem;
      font-size: 0.9rem;
    }
    .suggestion-num {
      min-width: 24px; height: 24px;
      background: rgba(108,99,255,0.2);
      color: var(--primary);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 700;
    }

    /* PROGRESS BAR */
    .progress-bar-wrap { background: var(--border); border-radius: 999px; height: 8px; width: 100%; }
    .progress-bar { height: 8px; border-radius: 999px; transition: width 1s ease; }
    .pb-success { background: var(--success); }
    .pb-info { background: var(--info); }
    .pb-warning { background: var(--warning); }
    .pb-danger { background: var(--danger); }

    /* TABS */
    .tabs { display: flex; gap: 0.5rem; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
    .tab-btn {
      padding: 0.6rem 1.2rem;
      border: none;
      background: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.92rem;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.2s;
    }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .mt-1 { margin-top: 0.5rem; }
    .mt-2 { margin-top: 1rem; }
    .mt-3 { margin-top: 1.5rem; }
    .mb-1 { margin-bottom: 0.5rem; }
    .mb-2 { margin-bottom: 1rem; }
    .text-muted { color: var(--muted); }
    .text-sm { font-size: 0.85rem; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-1 { gap: 0.5rem; }
    .gap-2 { gap: 1rem; }
  </style>
</head>
<body>
  {% if user.is_authenticated %}
  <nav>
    <a href="{% url 'dashboard' %}" class="nav-brand">🤖 ResumeAI</a>
    <div class="nav-links">
      <a href="{% url 'dashboard' %}" {% if request.resolver_match.url_name == 'dashboard' %}class="active"{% endif %}>Dashboard</a>
      <a href="{% url 'screen' %}" {% if request.resolver_match.url_name == 'screen' %}class="active"{% endif %}>Screen Resume</a>
      <a href="{% url 'history' %}" {% if request.resolver_match.url_name == 'history' %}class="active"{% endif %}>History</a>
      <a href="{% url 'logout' %}" class="btn-nav">Logout</a>
    </div>
  </nav>
  {% endif %}

  <main>
    {% for msg in messages %}
      <div class="alert {% if msg.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">{{ msg }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
